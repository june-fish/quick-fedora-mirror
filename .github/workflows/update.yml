name: Update upstream

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Update flake inputs
        run: nix flake update

      # Bumps rev/hash/version to the latest upstream master commit, then
      # builds the package (including its test suite) so broken updates fail here.
      - name: Update quick-fedora-mirror
        run: nix run nixpkgs#nix-update -- --flake --version=branch --build quick-fedora-mirror

      # nix-update skips the build when the package itself is unchanged.
      - name: Build
        run: nix build .#quick-fedora-mirror

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No updates."
            exit 0
          fi

          msgs=()
          if ! git diff --quiet -- package.nix; then
            msgs+=("quick-fedora-mirror: update to $(nix eval --raw .#quick-fedora-mirror.version)")
          fi
          if ! git diff --quiet -- flake.lock; then
            msgs+=("flake.lock: update")
          fi
          msg=$(IFS=';'; echo "${msgs[*]}" | sed 's/;/; /g')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$msg"
          git push
